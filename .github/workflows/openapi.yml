name: OpenAPI contract

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/api/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/openapi.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/openapi.yml'

jobs:
  openapi-export-check:
    name: Export and diff openapi.json
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate OpenAPI
        run: npm run docs:openapi

      - name: Fail if docs/api/openapi.json is stale
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- docs/api/openapi.json; then
            echo "::error::docs/api/openapi.json desactualizado. Ejecuta 'npm run docs:openapi' en apps/api y commitea el JSON."
            exit 1
          fi
